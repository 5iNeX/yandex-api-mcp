name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-changed:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint changed Python lines
        run: |
          python scripts/agent_lint.py --base-ref "${{ github.event.pull_request.base.sha }}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile check
        run: |
          python -m compileall -q src/mcp_yandex_ad
      - name: Tests
        run: |
          pytest -q

  docker-public-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install files and verify short command in a minimal PATH
        run: |
          sudo ./install.sh --prefix /srv/yp-installer-ci --project-name yp-ci --no-setup
          env PATH=/usr/bin:/bin yp --help
          sudo python3 -c "from pathlib import Path; root=Path('/srv/yp-installer-ci'); assert (root/'secrets').stat().st_mode & 0o777 == 0o700; assert (root/'secrets/yandex.env').stat().st_mode & 0o777 == 0o600"
      - name: Installer Docker runtime smoke (no live API)
        run: python3 scripts/installer_smoke.py

  installer-python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m compileall -q installer
      - run: python -m pytest -q tests/test_installer.py
