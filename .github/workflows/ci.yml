name: CI

on:
  push:
    branches: [main, codex/yandex-api-mcp]
  pull_request:
  workflow_dispatch:

jobs:
  lint-changed:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint changed Python lines
        run: |
          python scripts/agent_lint.py --base-ref "${{ github.event.pull_request.base.sha }}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile check
        run: |
          python -m compileall -q src/mcp_yandex_ad
      - name: Tests
        run: |
          pytest -q

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm --prefix core ci
      - run: npm run build
      - run: npm test

  docker-public-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build public image
        run: docker build -t yandex-api-mcp:ci .
      - name: MCP health smoke with dummy credentials
        run: |
          docker run -d --name yandex-api-mcp-ci -e YANDEX_OAUTH_TOKEN=dummy -e YANDEX_ACCESS_TOKEN=dummy -e MCP_BIND_HOST=0.0.0.0 -p 127.0.0.1:8001:8001 yandex-api-mcp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/healthz | grep -q '"status":"ok"'; then exit 0; fi
            sleep 1
          done
          docker logs yandex-api-mcp-ci
          exit 1

  installer-python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m compileall -q installer scripts/yp_api.py
      - run: python -m pytest -q tests/test_installer.py tests/test_yp_api.py
